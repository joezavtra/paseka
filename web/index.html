<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gource-reborn</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #c9d1d9;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }
      /* Строка состояния и панель транспорта живут в одной колонке, прижатой
         к низу экрана, а не позиционируются каждая сама по себе: раньше оба
         блока были прибиты к левому нижнему углу и текст ложился поверх
         кнопки воспроизведения и списка скорости. Колонка разводит их по
         вертикали при любой ширине окна и при любой длине текста.
         pointer-events: none на самой колонке — чтобы её пустые промежутки не
         отбирали у холста перетаскивание камеры; детям право на клик
         возвращается явно. */
      #hud { position: fixed; left: 12px; right: 12px; bottom: 12px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        pointer-events: none; }
      #hud > * { pointer-events: auto; }
      /* pointer-events: none у строки состояния безвреден и оставлен: это
         чисто информационный текст, перехватывать указатель ему незачем. */
      #status { max-width: 100%; box-sizing: border-box; padding: 6px 10px;
        background: #161b22cc; border: 1px solid #30363d; border-radius: 6px;
        pointer-events: none; }
      #status[hidden] { display: none; }
      #fatal { position: fixed; left: 12px; top: 12px; padding: 8px 12px;
        background: #3d1418; border: 1px solid #ff7b72; border-radius: 6px;
        color: #ff7b72; max-width: 60ch; }
      #fatal[hidden] { display: none; }
      #transport { align-self: stretch; box-sizing: border-box;
        display: flex; align-items: center; gap: 10px; padding: 8px 12px;
        background: #161b22e6; border: 1px solid #30363d; border-radius: 8px; }
      #transport button { min-width: 34px; padding: 4px 8px; cursor: pointer;
        background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
        border-radius: 5px; font: inherit; }
      #transport select { background: #21262d; color: #c9d1d9; font: inherit;
        border: 1px solid #30363d; border-radius: 5px; padding: 4px; }
      /* Дорожке отдаётся минимум ширины, а подпись под курсором ужимается:
         иначе на узком окне подпись в 34ch съедала всю строку и слайдер
         вырождался в несколько пикселей. */
      #track { position: relative; flex: 1 1 auto; min-width: 140px; height: 28px; }
      #histogram { position: absolute; inset: 0; width: 100%; height: 100%; }
      #track input { position: absolute; inset: 0; width: 100%; margin: 0; }
      #cursor-label { flex: 0 1 auto; min-width: 0; color: #8b949e;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sidebar { position: fixed; left: 12px; top: 12px; width: 260px; max-height: 70vh;
        overflow: auto; padding: 10px 12px; background: #161b22e6;
        border: 1px solid #30363d; border-radius: 8px; }
      #sidebar[hidden] { display: none; }
      #sidebar h2 { margin: 0 0 6px; font-size: 12px; color: #8b949e; font-weight: 600; }
      #sidebar section + section { margin-top: 12px; }
      #sidebar label { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
      #sidebar input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px 6px;
        background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px;
        font: inherit; }
      .tree-row { display: flex; align-items: center; gap: 4px; }
      .tree-row button { width: 18px; padding: 0; background: none; border: none;
        color: #8b949e; cursor: pointer; font: inherit; }
      .tree-children { margin-left: 14px; }
      #inspector { position: fixed; right: 12px; top: 12px; width: 300px; max-height: 70vh;
        overflow: auto; padding: 10px 12px; background: #161b22e6;
        border: 1px solid #30363d; border-radius: 8px; }
      #inspector[hidden] { display: none; }
      /* padding-right резервирует место под кнопку закрытия: без него длинное
         имя файла подтекает под неё. */
      #inspector h2 { margin: 0; font-size: 14px; padding-right: 22px; }
      #inspector .path { color: #8b949e; overflow-wrap: anywhere; margin: 2px 0 8px; }
      #inspector .row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
      #inspector .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      #inspector canvas { width: 100%; height: 28px; display: block; margin: 6px 0; }
      #inspector .commit { color: #8b949e; overflow-wrap: anywhere; }
      /* position: fixed, а не absolute: у #inspector есть overflow: auto, и
         абсолютно спозиционированный потомок того же элемента прокручивался
         бы вместе с содержимым — на длинной карточке (пять авторов, пять
         коммитов) кнопка уезжала бы вверх за край и переставала быть
         доступной мышью. #inspector сам position: fixed, но это не создаёт
         содержащий блок для fixed-потомков (только для absolute) — поэтому
         координаты здесь считаются от вьюпорта: 12px (отступ #inspector) +
         8px/6px (прежний отступ кнопки) = 20px/18px. Кнопка всё равно исчезает
         вместе с карточкой: #inspector[hidden] задаёт display: none на всё
         поддерево, включая fixed-потомков. */
      #inspector .close { position: fixed; right: 20px; top: 18px; background: none;
        border: none; color: #8b949e; cursor: pointer; font: inherit; z-index: 1; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <aside id="sidebar" hidden></aside>
    <aside id="inspector" hidden></aside>
    <div id="hud">
      <div id="status">Читаю историю репозитория…</div>
      <div id="transport" hidden></div>
    </div>
    <div id="fatal" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
