<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>paseka</title>
    <style>
      :root { color-scheme: dark; }
      /* Фон страницы обязан совпадать с фоном сцены: источник истины для кода —
         SCENE_BACKGROUND в web/render/palette.ts (оттуда его берут отрисовка
         значков и тест их контраста). CSS модуль не читает, поэтому здесь копия;
         меняя цвет, правьте оба места — и только эти два. */
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #c9d1d9;
        font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
      #scene { display: block; width: 100vw; height: 100vh; }
      /* Строка состояния и панель транспорта живут в одной колонке, прижатой
         к низу экрана, а не позиционируются каждая сама по себе: раньше оба
         блока были прибиты к левому нижнему углу и текст ложился поверх
         кнопки воспроизведения и списка скорости. Колонка разводит их по
         вертикали при любой ширине окна и при любой длине текста.
         pointer-events: none на самой колонке — чтобы её пустые промежутки не
         отбирали у холста перетаскивание камеры; детям право на клик
         возвращается явно. */
      #hud { position: fixed; left: 12px; right: 12px; bottom: 12px;
        display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
        pointer-events: none; }
      #hud > * { pointer-events: auto; }
      /* pointer-events: none у строки состояния безвреден и оставлен: это
         чисто информационный текст, перехватывать указатель ему незачем. */
      #status { max-width: 100%; box-sizing: border-box; padding: 6px 10px;
        background: #161b22cc; border: 1px solid #30363d; border-radius: 6px;
        pointer-events: none; }
      #status[hidden] { display: none; }
      #fatal { position: fixed; left: 12px; top: 12px; padding: 8px 12px;
        background: #3d1418; border: 1px solid #ff7b72; border-radius: 6px;
        color: #ff7b72; max-width: 60ch; }
      #fatal[hidden] { display: none; }
      /* Панель транспорта — две строки: органы управления и подпись под
         курсором. Раньше подпись стояла в одной строке с дорожкой и забирала
         ширину по длине темы коммита, а темы бывают и в два слова, и в целое
         предложение из пул-реквеста. Дорожка при этом ужималась и разжималась
         на каждом шаге воспроизведения, и прицелиться в нужное место истории
         было невозможно: под курсором мыши оказывался уже другой коммит. */
      #transport { align-self: stretch; box-sizing: border-box;
        display: flex; flex-direction: column; align-items: stretch; gap: 6px;
        padding: 8px 12px;
        background: #161b22e6; border: 1px solid #30363d; border-radius: 8px; }
      .transport-controls { display: flex; align-items: center; gap: 10px; }
      #transport button { min-width: 34px; padding: 4px 8px; cursor: pointer;
        background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
        border-radius: 5px; font: inherit; }
      #transport select { background: #21262d; color: #c9d1d9; font: inherit;
        border: 1px solid #30363d; border-radius: 5px; padding: 4px; }
      /* Дорожка занимает всю строку, кроме кнопки и списка скорости: её ширина
         зависит только от ширины окна, а значит не меняется при перемотке. */
      #track { position: relative; flex: 1 1 auto; min-width: 140px; height: 28px; }
      #histogram { position: absolute; inset: 0; width: 100%; height: 100%; }
      #track input { position: absolute; inset: 0; width: 100%; margin: 0; }
      /* Своя строка целиком: длинная тема обрезается многоточием и ни у чего
         не отнимает ширину. Высота резервируется заранее, иначе панель
         подрастала бы на строку в момент появления первой подписи и HUD
         дёрнулся бы вместе с вписыванием камеры. */
      #cursor-label { min-height: 1.4em; color: #8b949e;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sidebar { position: fixed; left: 12px; top: 12px; width: 260px; max-height: 70vh;
        overflow: auto; padding: 10px 12px; background: #161b22e6;
        border: 1px solid #30363d; border-radius: 8px; }
      #sidebar[hidden] { display: none; }
      #sidebar h2 { margin: 0 0 6px; font-size: 12px; color: #8b949e; font-weight: 600; }
      #sidebar section + section { margin-top: 12px; }
      #sidebar label { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
      #sidebar input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px 6px;
        background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px;
        font: inherit; }
      .tree-row { display: flex; align-items: center; gap: 4px; }
      .tree-row button { width: 18px; padding: 0; background: none; border: none;
        color: #8b949e; cursor: pointer; font: inherit; }
      .tree-children { margin-left: 14px; }
      /* Правая колонка: сверху настройки физики, под ними карточка узла.
         Раньше карточка позиционировалась сама и занимала верхний правый угол;
         теперь угол делят двое, и раскладывать их должен один контейнер, иначе
         они наезжали бы друг на друга при открытии второго.
         pointer-events: none на самой колонке — чтобы её пустые промежутки не
         отбирали у холста перетаскивание камеры; детям право на клик
         возвращается явно (тот же приём, что у #hud). */
      #right-rail { position: fixed; right: 12px; top: 12px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        max-height: calc(100vh - 24px); pointer-events: none; }
      #right-rail > * { pointer-events: auto; box-sizing: border-box; width: 300px; }
      #physics { padding: 8px 10px; background: #161b22e6;
        border: 1px solid #30363d; border-radius: 8px; }
      #physics[hidden] { display: none; }
      .physics-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      #physics h2 { margin: 0; font-size: 12px; color: #8b949e; font-weight: 600; }
      .physics-header button { min-width: 22px; padding: 0 6px; background: #21262d;
        color: #c9d1d9; border: 1px solid #30363d; border-radius: 5px; font: inherit; cursor: pointer; }
      .physics-body { margin-top: 6px; max-height: 46vh; overflow: auto; }
      .physics-body[hidden] { display: none; }
      /* Подпись и значение в строку, ползунок под ними во всю ширину: так
         цифра меняющейся длины не двигает ползунок по горизонтали. */
      .physics-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
        align-items: center; padding: 2px 0; }
      .physics-row label { color: #8b949e; }
      .physics-value { color: #c9d1d9; font-variant-numeric: tabular-nums; }
      .physics-row input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; }
      .physics-reset { margin-top: 8px; width: 100%; padding: 4px 8px; cursor: pointer;
        background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
        border-radius: 5px; font: inherit; }
      #inspector { max-height: 70vh;
        overflow: auto; padding: 10px 12px; background: #161b22e6;
        border: 1px solid #30363d; border-radius: 8px; }
      #inspector[hidden] { display: none; }
      /* padding-right резервирует место под кнопку закрытия: без него длинное
         имя файла подтекает под неё. */
      #inspector h2 { margin: 0; font-size: 14px; padding-right: 22px; }
      #inspector .path { color: #8b949e; overflow-wrap: anywhere; margin: 2px 0 8px; }
      #inspector .row { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
      #inspector .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      #inspector canvas { width: 100%; height: 28px; display: block; margin: 6px 0; }
      #inspector .commit { color: #8b949e; overflow-wrap: anywhere; }
      /* Кнопка закрытия липнет к верху своего же прокручиваемого содержимого.
         Раньше она была position: fixed с координатами угла экрана — это
         держалось на том, что карточка сама стояла в углу. Теперь карточка
         лежит в колонке под настройками физики, и привязка к экрану оторвала
         бы кнопку от карточки. sticky даёт то же, ради чего вводился fixed: на
         длинной карточке кнопка не уезжает за верхний край при прокрутке.
         Фон обязателен — под кнопкой проезжает содержимое. */
      #inspector .close { position: sticky; top: -10px; float: right; z-index: 1;
        margin: -4px -4px 0 0; padding: 2px 6px; background: #161b22; border: none;
        border-radius: 5px; color: #8b949e; cursor: pointer; font: inherit; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <aside id="sidebar" hidden></aside>
    <div id="right-rail">
      <section id="physics" hidden></section>
      <aside id="inspector" hidden></aside>
    </div>
    <div id="hud">
      <div id="status">Читаю историю репозитория…</div>
      <div id="transport" hidden></div>
    </div>
    <div id="fatal" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
